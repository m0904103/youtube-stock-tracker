<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股網紅觀點追蹤 | 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="container">
            <h1>Influencer Stock Tracker <span class="badge">2026.06</span></h1>
            <p class="subtitle">追蹤您最愛的六位美股 YouTuber 最新觀點與佈局策略</p>
        </div>
    </header>

    <main class="container">
        <section class="consensus-section">
            <h2 style="color: #fff; font-size: 1.5rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                🔥 綜合推薦買入榜單
            </h2>
            <div class="consensus-cards">
                <div class="consensus-card">
                    <div class="ticker">NVDA</div>
                    <div class="mentions">被提及 4 次</div>
                    <p class="reason">小左、老李、NaNa、游庭皓共同關注。AI 硬體核心，但需等待技術回調與關鍵支撐位介入，切勿盲目追高。</p>
                </div>
                <div class="consensus-card">
                    <div class="ticker">MU</div>
                    <div class="mentions">被提及 2 次</div>
                    <p class="reason">小左、老李關注。受惠於 AI 算力與記憶體超級週期，老李建議逢低佈局。</p>
                </div>
                <div class="consensus-card">
                    <div class="ticker">其他潛力標的</div>
                    <div class="mentions">各自看好</div>
                    <p class="reason">TSLA, TSMC, INTC, PLTR, ARM 等。部分網紅建議透過「槓鈴策略」分散配置至能源或金融防禦板塊。</p>
                </div>
            </div>
        </section>

        <div class="grid" id="influencer-grid">
            <!-- Cards will be injected by JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 美股網紅觀點追蹤. 資料僅供參考，不構成投資建議。</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
