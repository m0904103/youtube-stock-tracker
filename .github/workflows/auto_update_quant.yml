name: Auto Update Quant Data

on:
  schedule:
    - cron: '15 */4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unified Quant & KOL Intelligence Script
        run: python scripts/daily_fetch.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alt_data.json script.js index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant & KOL intelligence data" && git pull --rebase origin main && git push origin main)
