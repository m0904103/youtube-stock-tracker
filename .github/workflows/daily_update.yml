name: Daily Stock Intelligence Auto Sync

on:
  schedule:
    # 每日台股開盤前 08:30 (UTC 00:30)
    - cron: '30 0 * * 1-5'
    # 每日台股收盤後 14:00 (UTC 06:00)
    - cron: '0 6 * * 1-5'
    # 每日美股開盤前 20:30 (UTC 12:30)
    - cron: '30 12 * * 1-5'
    # 每日美股收盤後 06:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Unified Institutional & Quant Intelligence Sync
        run: |
          python scripts/daily_fetch.py

      - name: 4. Auto Commit & Push to GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add alt_data.json script.js index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update institutional sentiment, KOL radar & quant GEX data" && git pull --rebase origin main && git push origin main)
